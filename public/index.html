<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Icebreaker Card</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f4f5; color: #18181b; }
  .card { width: 100%; max-width: 420px; background: #fff; border-radius: 20px; overflow: hidden;
          box-shadow: 0 10px 30px rgba(0,0,0,.12); text-align: center; }
  .top { padding: 28px 20px; color: #fff; background: var(--c, #3f3f46); }
  .label { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .name { font-size: 44px; font-weight: 800; margin: 8px 0 0; text-transform: uppercase; word-break: break-word; }
  .body { padding: 24px 20px 28px; }
  .prompt { font-size: 22px; font-weight: 600; margin: 8px 0 20px; line-height: 1.3; }
  .hint { color: #52525b; font-size: 15px; }
  .muted { color: #71717a; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top"><div class="label">Fun tips you may not already know</div><div class="name" id="name">…</div></div>
  <div class="body" id="body"><p class="hint">Finding your group…</p></div>
</div>
<script>
  let id = null;
  try { id = localStorage.getItem('icebreaker-id'); } catch {}
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random());
    try { localStorage.setItem('icebreaker-id', id); } catch {}
  }

  fetch('/api/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })
    .then(r => r.json())
    .then(cat => {
      document.getElementById('card').style.setProperty('--c', cat.color);
      document.getElementById('name').textContent = cat.name;
      document.getElementById('body').innerHTML =
        '<div class="label" style="color:#71717a">Your group prompt</div>' +
        '<p class="prompt"></p>' +
        '<p class="hint">Find everyone else with <b></b> and share your lesson.</p>' +
        '<p class="muted">Keep this screen open to show your group.</p>';
      document.querySelector('.prompt').textContent = cat.prompt;
      document.querySelector('.hint b').textContent = cat.name.toUpperCase();
    })
    .catch(() => {
      document.getElementById('body').innerHTML = '<p class="hint">Couldn’t connect. Please refresh the page.</p>';
    });
</script>
</body>
</html>
