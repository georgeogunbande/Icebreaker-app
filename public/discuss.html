<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Discussion · TribeTap</title>
<style>
  /* Brand colors: replaced by the host's Branding when the page loads */
  :root { --bg: #0b0b0b; --gold: #d4a537; --card: #ffffff; --text: #18181b; --muted: #71717a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; align-content: center; padding: 16px;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .card { width: 100%; max-width: 440px; background: var(--card); border-radius: 20px; overflow: hidden;
          box-shadow: 0 10px 40px rgba(0,0,0,.5); border: 2px solid var(--c, var(--gold)); }
  .top { padding: 18px 20px 20px; color: #fff; background: var(--c, #3f3f46); text-align: center; }
  .label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
  .team { font-size: 24px; font-weight: 800; margin-top: 6px; text-transform: uppercase; }
  .mates { font-size: 13px; opacity: .9; margin-top: 4px; }
  .body { padding: 20px; }
  .qno { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .question { font-size: 21px; font-weight: 700; line-height: 1.35; margin: 8px 0 14px; }
  .pop { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  .clock { display: inline-block; font-weight: 800; font-variant-numeric: tabular-nums; background: #f4f4f5; border-radius: 999px;
           padding: 4px 12px; margin-bottom: 12px; }
  .clock.done { background: #fee2e2; color: #b91c1c; }
  textarea { width: 100%; min-height: 150px; padding: 14px; font: inherit; font-size: 17px; line-height: 1.4;
             border: 2px solid #d4d4d8; border-radius: 12px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--c, var(--gold)); }
  .status { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .hint { background: #f4f4f5; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: #3f3f46; margin-top: 14px; }
  .wait { text-align: center; padding: 30px 10px; color: var(--muted); }
  .powered { color: #a1a1aa; font-size: 12px; text-align: center; margin-top: 12px; }
  .powered b { color: var(--gold); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <div class="label">💬 Team discussion</div>
    <div class="team" id="team">…</div>
    <div class="mates" id="mates"></div>
  </div>
  <div class="body">
    <div id="live" class="hidden">
      <div class="qno" id="qno"></div>
      <div class="question" id="question"></div>
      <div class="clock hidden" id="clock"></div>
      <textarea id="answer" maxlength="600" placeholder="Talk it over with your team, then type your team’s answer here…"></textarea>
      <div class="status" id="status"></div>
      <div class="hint">👥 One answer per team: anyone on your team can type here, and it shows up on the big screen as you go.</div>
    </div>
    <div class="wait" id="wait">Loading…</div>
  </div>
</div>
<div class="powered">Powered by <b>🤝 TribeTap</b></div>
<script>
  const $ = (id) => document.getElementById(id);
  let id = null;
  try { id = localStorage.getItem('icebreaker-id'); } catch {}
  if (!id) location.replace('/');

  fetch('/api/brand').then((r) => r.json()).then((b) => {
    document.documentElement.style.setProperty('--gold', b.gold);
    document.documentElement.style.setProperty('--bg', b.bg);
  }).catch(() => {});

  // Typing is saved automatically about a second after you stop. While you type (or a save is pending), updates
  // from teammates don't overwrite the box; otherwise it shows the team's latest answer.
  let lastQ = null, pending = null, saving = false, offset = 0, endsAt = null;

  function show(d) {
    if (!d.active) return location.replace('/'); // the host ended the discussion: back to the game
    offset = d.now - Date.now();
    endsAt = d.endsAt;
    document.body.style.setProperty('--c', d.color);
    $('team').textContent = d.emoji + ' ' + d.name + ' · Team ' + d.team;
    $('mates').textContent = d.teammates.join(' · ');
    $('wait').classList.add('hidden');
    $('live').classList.remove('hidden');
    const newQ = d.q !== lastQ;
    if (newQ) {
      lastQ = d.q;
      clearTimeout(pending); pending = null;
      $('qno').textContent = 'Question ' + (d.q + 1) + ' of ' + d.total;
      $('question').textContent = d.question;
      $('question').classList.remove('pop'); void $('question').offsetWidth; $('question').classList.add('pop');
      if (navigator.vibrate) navigator.vibrate(80);
    }
    const typing = document.activeElement === $('answer') || pending || saving;
    if (newQ || !typing) $('answer').value = d.answer;
    if (!typing) $('status').textContent = d.answer ? '✅ On the big screen' + (d.answeredBy ? ' · last typed by ' + d.answeredBy : '') : '';
    tick();
  }

  function tick() {
    if (!endsAt) return $('clock').classList.add('hidden');
    const left = Math.ceil((endsAt - (Date.now() + offset)) / 1000);
    $('clock').classList.remove('hidden');
    $('clock').classList.toggle('done', left <= 0);
    $('clock').textContent = left > 0 ? '⏱️ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : '⏰ Time’s up! Finish your answer';
  }
  setInterval(tick, 500);

  function save() {
    pending = null;
    saving = true;
    $('status').textContent = 'Saving…';
    fetch('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, text: $('answer').value }) })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => { $('status').textContent = ok ? ($('answer').value.trim() ? '✅ On the big screen' : 'Answer cleared') : '⚠️ ' + (d.error || 'Not saved'); })
      .catch(() => { $('status').textContent = '⚠️ Not saved. Check your connection; it will retry when you type.'; })
      .finally(() => { saving = false; });
  }
  $('answer').oninput = () => {
    $('status').textContent = '✏️ Typing…';
    clearTimeout(pending);
    pending = setTimeout(save, 900);
  };

  const poll = () => fetch('/api/discussion?id=' + encodeURIComponent(id))
    .then((r) => (r.status === 404 ? location.replace('/') : r.json()))
    .then((d) => d && show(d))
    .catch(() => {});
  poll();
  setInterval(poll, 2500);
</script>
</body>
</html>
