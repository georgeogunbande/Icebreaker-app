services:
  - type: web
    name: icebreaker
    runtime: node
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: HOST_PIN
        sync: false
      # From your Upstash database's "REST API" section; keeps data safe across restarts
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
